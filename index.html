<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Abasovlar — Nəsil Kitabı</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
--gold: #b8952a;
--gold-light: #d4aa45;
--gold-pale: #f0e0b0;
--dark: #0e0b07;
--dark2: #1a1510;
--dark3: #2a2015;
--brown: #4a3520;
--cream: #f5edd8;
--cream2: #ede0c4;
--text: #2a1f10;
--text-light: #6b5540;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
background: var(--dark);
color: var(--cream);
font-family: 'Montserrat', sans-serif;
font-weight: 300;
overflow-x: hidden;
}

body::before {
content: '';
position: fixed;
inset: 0;
background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
pointer-events: none;
z-index: 9999;
opacity: 0.4;
}

header {
position: fixed;
top: 0; left: 0; right: 0;
z-index: 100;
padding: 20px 60px;
display: flex;
justify-content: space-between;
align-items: center;
background: linear-gradient(to bottom, rgba(14,11,7,0.98), transparent);
transition: background 0.4s;
}

.logo {
font-family: 'Cormorant Garamond', serif;
font-size: 1.5rem;
font-weight: 600;
color: var(--gold);
letter-spacing: 0.08em;
text-decoration: none;
}

.logo span {
display: block;
font-size: 0.55rem;
font-family: 'Montserrat', sans-serif;
font-weight: 400;
letter-spacing: 0.25em;
text-transform: uppercase;
color: var(--gold-pale);
margin-top: 2px;
}

nav { display: flex; gap: 36px; align-items: center; }
nav a {
color: var(--cream2);
text-decoration: none;
font-size: 0.7rem;
letter-spacing: 0.2em;
text-transform: uppercase;
font-weight: 500;
transition: color 0.3s;
position: relative;
}

.hero {
min-height: 100vh;
display: flex;
flex-direction: column;
justify-content: center;
align-items: center;
text-align: center;
position: relative;
padding: 120px 40px 80px;
}

.hero-bg {
position: absolute;
inset: 0;
background: radial-gradient(ellipse 80% 60% at 50% 40%, rgba(184,149,42,0.08) 0%, transparent 70%), linear-gradient(160deg, #0e0b07 0%, #1a1208 50%, #0e0b07 100%);
}

.hero-title {
font-family: 'Cormorant Garamond', serif;
font-size: clamp(3rem, 7vw, 6rem);
font-weight: 300;
line-height: 0.92;
color: var(--cream);
position: relative;
z-index: 1;
}

.hero-title em { color: var(--gold-light); font-style: italic; }

.section-label {
font-size: 0.6rem;
letter-spacing: 0.3em;
text-transform: uppercase;
color: var(--gold);
margin-bottom: 20px;
}

.gen-grid {
display: grid;
grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
gap: 20px;
padding: 60px;
max-width: 1400px;
margin: 0 auto;
}

.gen-card {
background: rgba(255,255,255,0.02);
border: 1px solid rgba(184,149,42,0.15);
padding: 40px;
transition: all 0.4s ease;
}

.gen-card:hover {
border-color: var(--gold);
background: rgba(184,149,42,0.05);
}

.gen-num { font-size: 2rem; margin-bottom: 15px; }
.gen-name { font-family: 'Cormorant Garamond', serif; font-size: 1.8rem; color: var(--gold-pale); margin-bottom: 10px; }
.gen-desc { font-size: 0.85rem; line-height: 1.6; color: rgba(255,255,255,0.7); }
</style>
</head>
<body>

<header>
<a href="#" class="logo">Abasovlar <span>Nəsil Kitabı</span></a>
<nav>
<a href="#nesiller">Nəsillər</a>
<a href="#tarix">Tarix</a>
<a href="#arxiv">Arxiv</a>
</nav>
</header>

<div class="hero">
<div class="hero-bg"></div>
<h1 class="hero-title"><em>Abasovlar</em><br>Nəsil Kitabı</h1>
<p style="position:relative; z-index:1; margin-top:20px; color:var(--gold-pale)">Saatlı, Əhmədbəyli — 1850-ci ildən bu günə</p>
</div>

<section id="nesiller" style="padding: 100px 0;">
<center><p class="section-label">Ailə Üzvləri</p></center>
<div class="gen-grid" id="familyGrid">
<!-- JavaScript məlumatları bura dolduracaq -->
</div>
</section>

<script>
const familyData = [
{
ad: "Azay Məmmədəli oğlu",
tarix: "1881 – ...",
rol: "Ulu Baba (Kök)",
qeyd: "Abasovlar nəslinin sənədləşdirilmiş ilk böyük nümayəndələrindən biri.",
icon: "📜"
},
{
ad: "Məmmədəli Abasov",
tarix: "1927 – 1978",
rol: "Baba",
qeyd: "Nəsil şəcərəsinin əsas dayağı. Əhmədbəyli kəndinin hörmətli ağsaqqallarından.",
icon: "👨‍👩‍👦"
},
{
ad: "Laçın Abasov",
tarix: "1971 – Bu gün",
rol: "Tədqiqatçı & Veteran",
qeyd: "I Qarabağ müharibəsi veteranı. Sosioloq və bu layihənin müəllifi.",
icon: "🎖️"
},
{
ad: "Ayla Abaslı",
tarix: "2010 – Bu gün",
rol: "Gənc Nəsil",
qeyd: "Kimya fənni üzrə respublika olimpiada qalibi. Nəslin parlaq gələcəyi.",
icon: "🧪"
}
];

function loadFamily() {
const grid = document.getElementById('familyGrid');
familyData.forEach(p => {
grid.innerHTML += `
<div class="gen-card">
<div class="gen-num">${p.icon}</div>
<div style="color:var(--gold); font-size:0.7rem; margin-bottom:5px;">${p.tarix}</div>
<div class="gen-name">${p.ad}</div>
<p class="gen-desc">${p.qeyd}</p>
<div style="margin-top:20px; font-size:0.6rem; text-transform:uppercase; letter-spacing:1px; color:var(--gold-light)">${p.rol}</div>
</div>
`;
});
}

window.onload = loadFamily;
</script>

</body>
</html>
